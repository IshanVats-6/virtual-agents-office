<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual agents office</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171f42; --ink:#eef2ff; --muted:#9aa7d0; --glass:rgba(16,24,56,.8); --line:rgba(160,180,255,.18); --lime:#C9EF52;
  --working:#3ee08f; --waiting:#ffb547; --idle:#6aa8ff; --sleeping:#8b94b8; --paused:#6b7394; --bad:#ff7b7b;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --inv:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1500px 1000px at 50% 30%,#29386e 0%,var(--bg) 58%,#10173a 100%);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
button{font:inherit}
#viewport{position:fixed;inset:0;cursor:grab;touch-action:none}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;overflow:visible;text-rendering:geometricPrecision}
.layer{position:absolute;left:0;top:0}
#signs{z-index:1}#actors{z-index:2}#glass{z-index:3}#labels{z-index:4}
#world.fade{transition:opacity .25s;opacity:0}

/* monitors */
.monitor{position:absolute;left:0;top:0;width:300px;height:210px;transform-origin:0 0;border-radius:9px;background:#0b1024;border:7px solid #151b2e;box-shadow:0 0 0 1px #2a3350 inset;overflow:hidden;font:10.5px/1.45 var(--mono);color:#cfd8ff;cursor:pointer}
.monitor .bar{display:flex;align-items:center;gap:5px;height:18px;padding:0 7px;background:#161e3a;color:#8a97c7;font-size:9.5px;white-space:nowrap;overflow:hidden}
.monitor .bar i{width:7px;height:7px;border-radius:50%;background:#ff5f57;flex:none}.monitor .bar i:nth-child(2){background:#febc2e}.monitor .bar i:nth-child(3){background:#28c840}
.monitor .bar span{overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.monitor .ttl{padding:5px 8px 3px;font-weight:600;color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #1d2748}
.monitor .lines{padding:4px 8px;height:145px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.monitor .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln.prompt,.it.prompt{color:#9ecbff}.ln.tool,.it.tool{color:#ffd479}.ln.say,.it.say{color:#e8ecff}.ln.result,.it.result{color:#7382ad}.ln.error,.it.error{color:#ff8080}.ln.think,.it.think{color:#b9a3ff}
.monitor .st{position:absolute;left:0;right:0;bottom:0;height:17px;padding:0 8px;display:flex;justify-content:space-between;align-items:center;background:#111834;font-size:9px;color:#8a97c7}
.caret{display:inline-block;width:6px;height:11px;background:#e8ecff;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.desk.working .monitor{box-shadow:0 0 0 1px #2a3350 inset,0 0 26px var(--tc)}
.desk.sleeping .monitor,.desk.paused .monitor{background:#070a16}
.saver{position:absolute;inset:18px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#4a5680;font:600 12px Inter;text-align:center}
.saver b{font:800 22px Inter;letter-spacing:.08em;color:var(--tc);opacity:.45;animation:standby 5s ease-in-out infinite}
@keyframes standby{50%{opacity:.18}}
.saver span{font:11px var(--mono);color:#56638f}
.saver .bad{color:var(--bad)}

/* labels: constant screen size, level of detail by zoom */
.anchor{position:absolute;width:0;height:0;transform-origin:0 0;transform:scale(var(--inv));pointer-events:none}
.tag{position:absolute;left:0;bottom:0;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;cursor:pointer}
.bubble{max-width:250px;padding:5px 10px;border-radius:10px;background:#fff;color:#1b2340;font-size:12px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anchor.waiting .bubble{background:var(--waiting);color:#2b1a00;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.anchor:not(.working):not(.waiting):not(.walking) .bubble{display:none}
.name{display:flex;flex-direction:column;align-items:center;padding:3px 10px 4px;border-radius:10px;background:rgba(10,16,40,.88);border:1px solid var(--line);white-space:nowrap;line-height:1.2}
.name .n{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.name .r{font-size:10.5px;color:#aab6e0;font-weight:500}
.name .r em{font-style:normal;color:var(--muted)}.name .r em.bad{color:var(--bad)}
.anchor.failed .name{border-color:var(--bad)}
.anchor.onbreak .bubble{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sleeping);flex:none;display:inline-block}
.working .dot,.dot.working{background:var(--working);box-shadow:0 0 8px var(--working)}.waiting .dot,.dot.waiting{background:var(--waiting);box-shadow:0 0 8px var(--waiting)}.idle .dot,.dot.idle{background:var(--idle)}.paused .dot,.dot.paused{background:transparent;border:1.5px solid var(--paused)}
.anchor.paused .name{opacity:.72}
.anchor.vacant .tag{display:none}
body.mid .name .r,body.mid .anchor:not(.waiting) .bubble{display:none}
body.far .anchor:not(.waiting) .tag{display:none}
body.far .anchor.waiting .name .r,body.far .anchor .bubble{display:none}
.podtag{display:none}
body.far .podtag{display:block}
.podtag .card{position:absolute;left:0;bottom:0;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;padding:4px 10px;border-radius:99px;background:rgba(10,16,40,.88);border:1px solid color-mix(in srgb,var(--tc) 70%,transparent);white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.podtag em{font-style:normal;font-weight:600;display:flex;align-items:center;gap:3px;color:#c9d3f5}.podtag em.f{color:var(--bad)}

/* people */
.hands{animation:type .28s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.desk.idle .seated{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-6deg)}
.desk.vacant .seated,.desk.vacant .sleeper{display:none!important}
.breathe{animation:breathe 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 100%}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-1.8px) scaleY(1.035)}}
.zzz text{font:900 16px Inter;fill:#eef2ff;stroke:#1b2340;stroke-width:3px;paint-order:stroke;opacity:0;animation:zfloat 4.2s ease-out infinite}
.zzz text:nth-child(2){animation-delay:1.4s;font-size:13px}.zzz text:nth-child(3){animation-delay:2.8s;font-size:10px}
@keyframes zfloat{0%{opacity:0;transform:translate(0,4px)}15%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(14px,-30px) rotate(12deg)}}
.desk.paused .sleeper{opacity:.7}
.glow{opacity:0;transition:opacity .6s}.desk.working .glow,.desk.waiting .glow{opacity:.9}
.walker{position:absolute;left:0;top:0;pointer-events:none}
.walker svg{position:absolute;left:0;top:0;overflow:visible}
.walker.moving .leg1,.walker.moving .arm2{animation:legA .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.walker.moving .leg2,.walker.moving .arm1{animation:legA .45s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
.walker.moving .bob{animation:bob .225s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
.walker.pose-sit .bob{transform:translateY(-13px)}
.walker.pose-sit .leg1{transform:rotate(-38deg) scaleY(.72);transform-box:fill-box;transform-origin:50% 0}
.walker.pose-sit .leg2{transform:rotate(-22deg) scaleY(.72);transform-box:fill-box;transform-origin:50% 0}
.walker.pose-lean .bob{transform:rotate(-6deg);transform-box:fill-box;transform-origin:50% 100%}
.walker.pose-lean .arm2{transform:rotate(78deg);transform-box:fill-box;transform-origin:50% 8%}
.walker.pose-lean .leg2{transform:translateX(-6px) rotate(12deg);transform-box:fill-box;transform-origin:50% 0}
.walker.talking:not(.moving) .arm1{animation:talk 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes talk{50%{transform:rotate(-40deg)}}
.neon{animation:flicker 7s infinite}
.ball{animation:ball 1.1s ease-in-out infinite}
@keyframes ball{0%,100%{transform:translate(0,26px)}25%{transform:translate(-6px,-4px)}50%{transform:translate(-12px,26px)}75%{transform:translate(-6px,-4px)}}
.stir{transform-box:fill-box;transform-origin:0% 50%;animation:stir 1.6s ease-in-out infinite}
@keyframes stir{50%{transform:rotate(8deg) translateY(-2px)}}
.steam path{animation:steam 2.4s ease-out infinite}.steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 6s ease-in-out infinite}
@keyframes wave{0%,70%,100%{transform:rotate(0)}75%,85%{transform:rotate(-22deg)}80%,90%{transform:rotate(14deg)}}
#receptionist:hover{filter:brightness(1.12)}
@keyframes flicker{0%,100%,93%,97%{opacity:1}95%{opacity:.55}}

/* hanging pod signs */
.podsign{position:absolute;left:0;top:0;width:520px;height:96px;transform-origin:0 0;border-radius:16px;padding:0 22px;display:flex;align-items:center;gap:14px;background:#0c1231;border:3px solid var(--tc);box-shadow:0 0 28px var(--tc),inset 0 0 18px color-mix(in srgb,var(--tc) 40%,transparent);pointer-events:none}
.podsign b{font:900 38px Inter;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.podsign span{margin-left:auto;font:700 26px var(--mono);color:var(--tc);white-space:nowrap}
.room-sign{position:absolute;left:0;top:0;width:300px;height:56px;transform-origin:0 0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(12,18,44,.8);border:1.5px solid rgba(201,239,82,.55);font:800 22px Inter;color:#eef6d0;pointer-events:none}
.room-sign small{font:600 13px var(--mono);color:var(--lime)}

/* HUD */
#hud{position:fixed;left:16px;top:14px;right:16px;display:flex;align-items:center;gap:10px;pointer-events:none;flex-wrap:wrap;z-index:5}
#hud>*{pointer-events:auto}
.pane{border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px}
.brand img{width:30px;height:30px;background:#fff;border-radius:8px;padding:2px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}.brand span{color:var(--muted);font:12px var(--mono)}
.live{width:8px;height:8px;border-radius:50%;background:var(--working);box-shadow:0 0 10px var(--working)}
.live.stale{background:var(--waiting);box-shadow:0 0 10px var(--waiting)}
.stats{display:flex;gap:4px;padding:5px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.05);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.spacer{flex:1}
.ctrl{display:flex;gap:3px;padding:5px;align-items:center}
.ctrl button{all:unset;cursor:pointer;min-width:30px;height:30px;padding:0 10px;border-radius:9px;display:flex;gap:6px;align-items:center;justify-content:center;color:var(--ink);font-weight:600;font-size:13px}
.ctrl button:hover{background:rgba(255,255,255,.08)}
.ctrl button.on{background:var(--lime);color:#111}
#demoBtn{font-size:14px;min-width:34px}
.ctrl .lbl{font-size:11.5px;color:var(--muted);padding:0 4px 0 8px}
.ctrl.links a{display:flex;align-items:center;height:30px;padding:0 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
.ctrl.links a:hover{background:rgba(255,255,255,.08)}
.ctrl.links a:last-child{color:#ff9ec0}
.built{position:fixed;right:16px;top:58px;z-index:5;font-size:11.5px;color:var(--muted);text-decoration:none}
.built:hover{color:var(--ink)}
body.clean #hud,body.clean #ticker,body.clean .hint,body.clean .built{display:none}
#banner{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12.5px;display:none;z-index:5;white-space:nowrap}
#banner.show{display:block}
#banner.demo{background:var(--lime);color:#111}
#banner.stale{background:var(--waiting);color:#2b1a00}
#ticker{position:fixed;left:16px;bottom:16px;width:min(420px,calc(100vw - 32px));padding:8px 12px;font-size:12px;z-index:4}
#ticker:not(.open){width:auto}#ticker:not(.open) #evs{display:none}#ticker:not(.open) h4{margin:0}
#tickHead{cursor:pointer;user-select:none;display:flex;gap:8px;align-items:center}#tickArrow{font-size:13px;color:var(--ink)}
#ticker h4,#dir h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#ticker .ev{display:flex;gap:8px;padding:2px 0;white-space:nowrap;overflow:hidden}
#ticker .ev b{flex:none}#ticker .ev span{overflow:hidden;text-overflow:ellipsis;color:#c9d3f5}#ticker .ev em{flex:none;margin-left:auto;color:var(--muted);font-style:normal;font-family:var(--mono);font-size:11px}
.hint{position:fixed;right:16px;bottom:16px;color:var(--muted);font-size:11.5px;text-align:right;line-height:1.7}
kbd{font:11px var(--mono);padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid var(--line)}

/* directory */
#dir{position:fixed;left:16px;top:70px;bottom:16px;width:340px;display:flex;flex-direction:column;transform:translateX(-120%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6}
#dir.open{transform:none}
#dir .hd{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
#dir input{all:unset;margin:0 12px 8px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px}
#dirList{overflow:auto;padding:0 8px 12px}
.grp{margin:10px 6px 4px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c9d3f5;cursor:pointer}
.grp i{width:10px;height:10px;border-radius:3px}
.grp span{margin-left:auto;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px;border-radius:9px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.06)}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 13px Inter;color:#10162e;position:relative}
.av .dot{position:absolute;right:-2px;bottom:-2px;border:2px solid #121a38;width:11px;height:11px}
.row b{display:block;font-size:13px}.row small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.row .when{font:10.5px var(--mono);color:var(--muted);text-align:right}

/* drawer: employee scorecard */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(450px,100vw);background:rgba(13,19,46,.97);border-left:1px solid var(--line);backdrop-filter:blur(14px);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:auto;z-index:10}
#drawer.open{transform:none}
#drawer .x{all:unset;position:absolute;right:12px;top:12px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.who{display:flex;gap:12px;align-items:center}
.big{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 23px Inter;color:#10162e}
#drawer h2{margin:0;font-size:22px}#drawer .sub{color:#c9d3f5;font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.now{margin-top:12px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.05);font-weight:600;display:flex;gap:8px;align-items:center}
.warn{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(255,90,90,.12);border:1px solid rgba(255,120,120,.35);color:#ffb3b3;font-size:12.5px}
.job b{font-size:15px}.job p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.sec h5{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.kpi span{font-size:11px;color:var(--muted)}
.kpi.good b{color:var(--working)}.kpi.bad b{color:var(--bad)}
.chart{width:100%;height:90px;display:block}
.chart rect:hover{opacity:.7}
.axis{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--muted);margin-top:4px}
.work{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.w{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.04);font-size:12.5px}
.w i{font-style:normal;font-size:15px}.w b{margin-left:auto;font-size:14px}
.w.zero{opacity:.4}
.run{padding:9px 0;border-bottom:1px dashed rgba(160,180,255,.14)}
.run:last-child{border:0}
.run .top{display:flex;gap:8px;font:11.5px var(--mono);color:#aab6e0}
.run .top b{color:var(--working);font-family:Inter}.run.bad .top b{color:var(--bad)}
.run .top em{margin-left:auto;font-style:normal;color:var(--muted)}
.run p{margin:4px 0 0;font-size:12.5px;color:#d7defa;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.run .files{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.run .files span{font:10.5px var(--mono);padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:#aab6e0}
.note{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.feed .it{padding:6px 0;border-bottom:1px dashed rgba(160,180,255,.12);display:grid;grid-template-columns:18px 1fr;gap:6px;font:11.5px/1.45 var(--mono)}
.feed .it small{grid-column:2;color:#65729b}
@media (max-width:760px){.stats,.hint,#ticker{display:none}#dir{width:calc(100vw - 32px)}}
</style>
</head>
<body>
<div id="viewport"><div id="world">
  <svg id="scene"></svg>
  <div class="layer" id="signs"></div>
  <div class="layer" id="actors"></div>
  <svg id="glass" style="pointer-events:none"></svg>
  <div class="layer" id="labels"></div>
</div></div>

<div id="hud">
  <div class="brand pane"><img src="/logo.svg" alt=""><b id="company">Agents office</b><div class="live" id="live"></div><span id="clock"></span></div>
  <div class="ctrl pane"><button id="dirBtn">👥 Team <span id="headcount"></span></button></div>
  <div class="stats pane" id="stats"></div>
  <div class="ctrl pane"><button id="demoBtn" title="Simulate a busy office (staged, not live data)">▶</button></div>
  <div class="spacer"></div>
  <div class="ctrl pane"><span class="lbl">Group by</span><button data-group="team" class="on">Team</button><button data-group="dept">Dept</button><button data-group="tool">Tool</button></div>
  <div class="ctrl pane"><button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button></div>
  <div class="ctrl pane links"><a href="https://github.com/IshanVats-6/virtual-agents-office" target="_blank" rel="noreferrer" title="Star the project on GitHub">★ Star</a><a href="https://github.com/sponsors/IshanVats-6" target="_blank" rel="noreferrer" title="Sponsor the project">♥ Sponsor</a></div>
</div>
<div id="banner"></div>
<a class="built" href="https://ivconsulting.in/?source=virtual-agents-office" target="_blank" rel="noreferrer">built by IV Consulting</a>

<aside id="dir" class="pane">
  <div class="hd"><h4 style="margin:0">Team directory</h4><button id="dirClose" style="all:unset;cursor:pointer;color:var(--muted);font-size:20px">×</button></div>
  <input id="dirSearch" placeholder="Search name, role, task…">
  <div id="dirList"></div>
</aside>

<div id="ticker" class="pane"><h4 id="tickHead">Live activity <span id="tickArrow">▸</span></h4><div id="evs"></div></div>

<script>
// ================= iso math =================
const T = 80, C = T * 0.8660254, S = T * 0.5;
const P = (x, y, z = 0) => [(x - y) * C, (x + y) * S - z * T];
const pts = (...ps) => ps.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
const NS = 'http://www.w3.org/2000/svg';
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f)))); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); };
function box(x, y, z, w, d, h, color, extra = '') {
  const top = pts(P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h));
  const left = pts(P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z));
  const right = pts(P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z));
  return `<g ${extra}><polygon points="${left}" fill="${shade(color, .84)}"/><polygon points="${right}" fill="${shade(color, .7)}"/><polygon points="${top}" fill="${color}"/></g>`;
}
const quad = (a, b, c, d, fill, extra = '') => `<polygon points="${pts(a, b, c, d)}" fill="${fill}" ${extra}/>`;
const wallText = (x, y, z, inner) => { const [a, b] = P(x, y, z); return `<g transform="matrix(0.866,0.5,0,1,${a.toFixed(1)},${b.toFixed(1)})">${inner}</g>`; };
const floorText = (x, y, inner) => { const [a, b] = P(x, y); return `<g transform="matrix(0.866,0.5,-0.866,0.5,${a.toFixed(1)},${b.toFixed(1)})">${inner}</g>`; };
function planeMatrix(x0, y, zTop, w, h, pxW, pxH) {
  const [ex, ey] = P(x0, y, zTop);
  return `matrix(${(w * C / pxW).toFixed(5)},${(w * S / pxW).toFixed(5)},0,${(h * T / pxH).toFixed(5)},${ex.toFixed(1)},${ey.toFixed(1)})`;
}
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (ms) => { if (!ms) return '-'; const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? Math.round(s) + 's' : s < 3600 ? Math.round(s / 60) + 'm' : s < 86400 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd'; };
const until = (ms) => { if (!ms) return ''; const s = (ms - Date.now()) / 1000; if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm'; if (s < 86400) return Math.round(s / 3600) + 'h'; return Math.round(s / 86400) + 'd'; };
const whenStr = (ms) => ms ? new Date(ms).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
const dur = (ms) => !ms || ms < 0 ? '-' : ms < 60e3 ? Math.round(ms / 1000) + 's' : ms < 3600e3 ? Math.round(ms / 60e3) + 'm' : (ms / 3600e3).toFixed(1) + 'h';
const money = (v) => v == null ? '-' : v >= 100 ? '$' + Math.round(v) : '$' + v.toFixed(2);
const num = (v) => v == null ? '-' : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : String(Math.round(v));

const ICON = { prompt: '›', tool: '⚙', say: '✦', result: '↳', error: '✗', think: '…' };
const LOGO = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M50,6 L92,30 L50,54 L8,30 Z" fill="#C9EF52"/><path d="M8,30 L50,54 L50,94 L8,70 Z" fill="#5B8DEF"/><path d="M92,30 L92,70 L50,94 L50,54 Z" fill="#2F3B66"/></g>`;

// ================= state =================
let STATE = null, LIVE = null, MODE = 'team', LAYOUT = null, DEMO = null;
const people = new Map();
const SKIN = ['#f2c7a5', '#e0a883', '#c68863', '#9c6644', '#7a4b2f', '#f6d5bb'];
const HAIR = ['#2b1d16', '#4a3222', '#23232b', '#8a5a2b', '#d9b36c', '#6b2f2f', '#3b3b46', '#b5651d'];
const groupKey = (e) => MODE === 'team' ? e.team : MODE === 'dept' ? e.dept : e.tool;
function groupMeta(k) {
  if (MODE === 'team') return { label: k, color: STATE.teams?.[k]?.color || '#9aa7d0', order: STATE.teams?.[k]?.order ?? 50 };
  if (MODE === 'dept') return { label: k, color: STATE.departments[k]?.color || '#9aa7d0', order: STATE.departments[k]?.order ?? 8 };
  return { label: STATE.tools[k]?.label || k, color: STATE.tools[k]?.color || '#9aa7d0', order: Object.keys(STATE.tools).indexOf(k) };
}
const colorOf = (e) => groupMeta(groupKey(e)).color;

// ================= layout =================
const PX = 3.0, PY = 3.3, BACK = 6.4, MAXW = 40;
function computeLayout(staff) {
  const G = new Map();
  for (const e of staff) { const k = groupKey(e); if (!G.has(k)) G.set(k, []); G.get(k).push(e); }
  const groups = [...G.entries()].map(([k, list]) => ({ key: k, ...groupMeta(k), list: list.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'staff' ? -1 : 1) || a.role.localeCompare(b.role)) }))
    .sort((a, b) => a.order - b.order || b.list.length - a.list.length);
  const zones = [], bands = [];
  const teamOrder = (k) => STATE.teams?.[k]?.order ?? 50;
  let x = 0.6, y = BACK + 2, bandH = 0;
  for (const g of groups) {
    // team view: one pod per group. dept/tool view: a wing holding one pod per team.
    const subsMap = new Map();
    for (const e of g.list) { const k = MODE === 'team' ? g.key : e.team; if (!subsMap.has(k)) subsMap.set(k, []); subsMap.get(k).push(e); }
    const subs = [...subsMap.entries()].sort((a, b) => teamOrder(a[0]) - teamOrder(b[0])).map(([k, list]) => ({ key: k, label: MODE === 'team' ? null : k, color: MODE === 'team' ? g.color : STATE.teams?.[k]?.color || g.color, list }));
    const blocks = [];
    let bx = 0.5, by = 1.5, rowH = 0, maxX = 0;
    for (const sub of subs) {
      const n = sub.list.length, cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
      const lab = sub.label ? 0.8 : 0;
      const bw = cols * PX + 0.6, bd = rows * PY + lab + 0.3;
      if (bx > 0.5 && bx + bw > 19) { bx = 0.5; by += rowH + 0.7; rowH = 0; }
      blocks.push({ ...sub, ox: bx, oy: by, cols, rows, bw, bd, lab });
      bx += bw + 0.7; rowH = Math.max(rowH, bd); maxX = Math.max(maxX, bx - 0.7);
    }
    const w = maxX + 0.5, d = by + rowH + 0.6;
    if (x > 0.6 && x + w > MAXW) { bands.push({ y, h: bandH }); y += bandH + 1.8; x = 0.6; bandH = 0; }
    zones.push({ ...g, x, y, w, d, blocks, wing: MODE !== 'team', band: bands.length });
    x += w + 1.8; bandH = Math.max(bandH, d);
  }
  bands.push({ y, h: bandH });
  const FW = Math.max(MAXW + 1, ...zones.map((z) => z.x + z.w + 0.6));
  const FD = y + bandH + 1.2;
  const desks = new Map();
  for (const z of zones) for (const b of z.blocks) b.list.forEach((e, i) => {
    const c = i % b.cols, r = Math.floor(i / b.cols);
    const dx = z.x + b.ox + 0.3 + c * PX, dy = z.y + b.oy + b.lab + 0.4 + r * PY;
    desks.set(e.id, { dx, dy, seat: [dx + 0.35, dy + 1.35], aisle: dy + 2.2, lane: dx + 2.5, band: z.band, zone: z });
  });
  const mkRoom = (key, name, x0, x1) => ({ key, name, x0, x1, door: x1 - 0.9, seats: [[x0 + 1.6, 1.35], [x0 + 2.8, 1.35], [x0 + 4, 1.35], [x0 + 1.6, 3.65], [x0 + 2.8, 3.65], [x0 + 4, 3.65], [x0 + 0.7, 2.5], [x0 + 4.95, 2.5]] });
  const rooms = [mkRoom('A', 'Huddle Room A', 10.4, 16.4), mkRoom('B', 'Huddle Room B', 16.9, 22.9)];
  const kitchen = { x0: 26.6, x1: 33.2, door: 29.6, spots: [[27.8, 3.9], [29.2, 4.2], [30.9, 3.9], [32.2, 3.2], [28.4, 2.2], [31.4, 2.2]] };
  const lounge = { x0: 33.6, x1: FW };
  const breakSpots = [
    ...[0, 1, 2, 3].map((q) => ({ key: 'stool' + q, x: kitchen.x0 + 1.75 + q * 0.8, y: 4.05, pose: 'sit', with: 'Chef Remy', door: kitchen.x0 + 1.75 + q * 0.8 })),
    { key: 'desk-l', x: 2.5, y: 3.45, pose: 'lean', with: 'Iris', door: 2.5 }, { key: 'desk-r', x: 5.3, y: 3.45, pose: 'lean', with: 'Iris', door: 5.3 },
  ];
  return { zones, bands, desks, FW, FD, rooms, kitchen, lounge, breakSpots, entrance: [5, 5.6], HX: FW + 0.9 };
}
const corridorY = (band) => LAYOUT.bands[band].y - 0.9;
function exitPath(place) {
  if (place.type === 'desk' || place.type === 'near') {
    const d = LAYOUT.desks.get(place.id); if (!d) return { pts: [], band: 0 };
    const start = place.type === 'desk' ? [...d.seat] : [d.seat[0] + 0.85, d.seat[1] + 0.35];
    return { pts: [start, [start[0], d.aisle], [d.lane, d.aisle], [d.lane, corridorY(d.band)]], band: d.band };
  }
  return { pts: [[place.x, place.y], [place.door, Math.max(place.y, BACK - 0.6)], [place.door, BACK + 0.7]], band: 0 };
}
function route(from, to) {
  const a = exitPath(from), b = exitPath(to);
  const p = [...a.pts];
  if (a.band !== b.band) p.push([LAYOUT.HX, corridorY(a.band)], [LAYOUT.HX, corridorY(b.band)]);
  p.push(...b.pts.slice().reverse());
  return p.filter((q, i) => i === 0 || Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) > 0.01);
}

// ================= scene =================
function drawScene() {
  const L = LAYOUT, W = L.FW + 1.8, D = L.FD;

  // pendant lights over the island
  for (let q = 0; q < 3; q++) { const [px0, py0] = P(k.x0 + 1.9 + q * 1.1, 3.1, 3.75), [px1, py1] = P(k.x0 + 1.9 + q * 1.1, 3.1, 2.35); s += `<ellipse cx="${px1}" cy="${py1 + 30}" rx="36" ry="16" fill="url(#lampglow)" opacity=".6"/><line x1="${px0}" y1="${py0}" x2="${px1}" y2="${py1 - 12}" stroke="#2b2f45" stroke-width="2"/><path d="M${px1 - 13},${py1} L${px1 - 6},${py1 - 14} L${px1 + 6},${py1 - 14} L${px1 + 13},${py1} Z" fill="#2b2f45"/><ellipse cx="${px1}" cy="${py1}" rx="13" ry="4" fill="#ffe7a3"/>`; }
  s += wallText(k.x0 + 0.3, 0.02, 3.4, `<text font-family="Inter" font-weight="900" font-size="30" fill="#dfe7ff">☕ KITCHEN</text>`);
  // ---- lounge + game zone ----
  const lx = L.lounge.x0;
  s += rug(lx + 0.4, 0.5, 6.2, BACK - 1.1, '#ff6b9a');

    if (key) { const r = LAYOUT.rooms.find((q) => q.key === key); return { type: 'spot', x: r.seats[6][0], y: r.seats[6][1], door: r.door, room: r, why: 'huddle' }; }

// ================= drawer: employee scorecard =================

function chartSVG(daily, useCost) {

    <div class="pills">${[e.team, e.dept !== e.team ? e.dept : null, STATE.tools[e.tool]?.label, e.kind === 'staff' ? 'Staff' : 'Contractor', e.schedule].filter(Boolean).map((p) => `<span class="pill">${esc(p)}</span>`).join('')}</div>
    <div class="now"><span class="dot ${e.status}"></span>${esc(nowTxt)}</div>

  <div class="sec"><h5><span>Work delivered · ${days}d</span></h5><div class="work">${work.map(([i, l, v]) => `<div class="w ${v ? '' : 'zero'}"><i>${i}</i>${l}<b>${num(v || 0)}</b></div>`).join('')}</div></div>
  <div class="sec"><h5><span>Recent runs</span><span>${e.lastRun ? 'last ' + ago(e.lastRun) + ' ago' : ''}</span></h5>
    ${s.recent?.length ? s.recent.map((r) => `<div class="run ${r.failed ? 'bad' : ''}"><div class="top"><b>${r.failed ? '⚠ failed' : '✓ done'}</b><span>${whenStr(r.start)}</span><em>${dur(r.ms)}${r.cost != null ? ' · ' + money(r.cost) : r.tokens ? ' · ' + num(r.tokens) + ' tok' : ''}</em></div>${r.outcome ? `<p>${esc(r.outcome)}</p>` : ''}${r.topFiles?.length ? `<div class="files">${r.topFiles.map((f) => `<span>${esc(f)}</span>`).join('')}</div>` : ''}</div>`).join('') : `<p class="note">No runs in the last ${days} days.${e.status === 'paused' ? ' The schedule is paused.' : e.nextRun ? ' Next shift ' + whenStr(e.nextRun) + '.' : ''}</p>`}

function openCompany() {

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').scrollTop = 0;

  const [x, y] = P(RECEPTION.x, RECEPTION.y, 1); zoomTo(x, y, Math.max(Pan.s, 1.3), Math.min(450, innerWidth));

function fillCompany() {
  const t = STATE.totals || {}, days = STATE.analyticsDays || 30, c = counts(STATE.staff);
  const staff = STATE.staff.filter((e) => e.kind === 'staff');

  const byTeam = LAYOUT.zones.map((z) => ({ z, cost: z.list.reduce((a, e) => a + (e.stats?.cost || 0), 0), runs: z.list.reduce((a, e) => a + (e.stats?.runs || 0), 0) })).sort((a, b) => b.cost - a.cost);
  const maxCost = Math.max(...byTeam.map((b) => b.cost), 0.01);
  const attention = STATE.staff.filter((e) => e.status === 'waiting' || (e.failed && (e.status === 'sleeping' || e.status === 'paused')));
  const top = [...STATE.staff].filter((e) => e.stats?.cost).sort((a, b) => b.stats.cost - a.stats.cost).slice(0, 5);
  const next = staff.filter((e) => e.nextRun).sort((a, b) => a.nextRun - b.nextRun).slice(0, 6);
  const row = (e, right) => `<div class="row" data-id="${esc(e.id)}"><div class="av" style="background:${colorOf(e)}">${esc(e.name[0])}<span class="dot ${e.status}"></span></div><div><b>${esc(e.name)}</b><small>${esc(e.role)}</small></div><div class="when">${right}</div></div>`;

  <div class="sec"><h5><span>Right now</span></h5><div class="kpis">
    <div class="kpi ${c.working ? 'good' : ''}"><b>${c.working}</b><span>working</span></div>
    <div class="kpi ${c.waiting ? 'bad' : ''}"><b>${c.waiting}</b><span>need you</span></div>
    <div class="kpi"><b>${c.sleeping}</b><span>asleep</span></div>

    <div class="kpi"><b>${STATE.staff.length - staff.length}</b><span>contractors</span></div>

  <div class="sec"><h5><span>Last ${days} days</span></h5><div class="kpis">

  <div class="sec"><h5><span>Spend by team</span></h5>${byTeam.map((b) => `<div class="w" style="margin-bottom:6px;position:relative;overflow:hidden"><span style="position:absolute;inset:0 auto 0 0;width:${(b.cost / maxCost) * 100}%;background:${b.z.color};opacity:.22"></span><span style="position:relative">${esc(b.z.label)}</span><b style="position:relative">${money(b.cost)}</b><span style="position:relative;color:var(--muted);font-size:11px;width:60px;text-align:right">${b.runs} runs</span></div>`).join('')}</div>

function closeDrawer() { drawerId = null; document.getElementById('drawer').classList.remove('open'); }
document.getElementById('closeDrawer').onclick = closeDrawer;

// ================= pan / zoom =================
const vp = document.getElementById('viewport'), world = document.getElementById('world');
const Pan = { x: 0, y: 0, s: 1, moved: false };
function apply() {
  world.style.transform = `translate(${Pan.x}px,${Pan.y}px) scale(${Pan.s})`;
  world.style.setProperty('--inv', (1 / Pan.s).toFixed(4));
  document.body.classList.toggle('far', Pan.s < 0.4);
  document.body.classList.toggle('mid', Pan.s >= 0.4 && Pan.s < 0.85);
}
function bounds() { const W = LAYOUT.FW + 1.8; const a = P(-0.3, LAYOUT.FD), b = P(W, -0.3), c = P(-0.3, -0.3, 5.2), d = P(W, LAYOUT.FD, -0.3); return { x0: a[0], x1: b[0], y0: c[1], y1: d[1] }; }
let anim = null;
function animateTo(x, y, s, ms = 650) {
  cancelAnimationFrame(anim);
  const f = { ...Pan }, t0 = performance.now();
  const step = (now) => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3); Pan.x = f.x + (x - f.x) * e; Pan.y = f.y + (y - f.y) * e; Pan.s = f.s + (s - f.s) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function fit(animated = true) {
  const b = bounds(), W = innerWidth, H = innerHeight - 70;
  const s = Math.min(W / (b.x1 - b.x0), H / (b.y1 - b.y0)) * 0.97;
  minS = s * 0.75;
  const x = (W - (b.x1 - b.x0) * s) / 2 - b.x0 * s, y = 70 + (H - (b.y1 - b.y0) * s) / 2 - b.y0 * s;
  animated ? animateTo(x, y, s) : (Object.assign(Pan, { x, y, s }), apply());
}
function zoomTo(wx, wy, s, right = 0, left = 0) { animateTo(left + (innerWidth - right - left) / 2 - wx * s, innerHeight / 2 - wy * s, s); }
function focusZone(z) { const [x, y] = P(z.x + z.w / 2, z.y + z.d / 2, 0.8); zoomTo(x, y, Math.max(z.wing ? 0.42 : 0.9, Math.min(1.5, innerWidth / ((z.w + z.d) * C * 1.1), innerHeight / ((z.w + z.d) * S * 1.25 + 220))), 0, dirOpen() ? 356 : 0); }
let minS = 0.08;
function zoomAt(cx, cy, f) { const s = Math.max(minS, Math.min(6, Pan.s * f)); Pan.x = cx - (cx - Pan.x) * (s / Pan.s); Pan.y = cy - (cy - Pan.y) * (s / Pan.s); Pan.s = s; apply(); }
vp.addEventListener('wheel', (e) => { e.preventDefault(); cancelAnimationFrame(anim); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022))); }, { passive: false });
let drag = null, pinch = null;
vp.addEventListener('pointerdown', (e) => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, px: Pan.x, py: Pan.y }; Pan.moved = false; });
addEventListener('pointermove', (e) => { if (!drag || pinch) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!Pan.moved && Math.hypot(dx, dy) > 4) { Pan.moved = true; vp.classList.add('dragging'); cancelAnimationFrame(anim); } if (Pan.moved) { Pan.x = drag.px + dx; Pan.y = drag.py + dy; apply(); } });
addEventListener('pointerup', () => { drag = null; vp.classList.remove('dragging'); setTimeout(() => (Pan.moved = false), 0); });
// two-finger pinch zoom on phones
vp.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { const [a, b] = e.touches; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 }; Pan.moved = true; } }, { passive: true });
vp.addEventListener('touchmove', (e) => { if (pinch && e.touches.length === 2) { const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoomAt(pinch.cx, pinch.cy, d / pinch.d); pinch.d = d; } }, { passive: true });
vp.addEventListener('touchend', () => { if (pinch) setTimeout(() => (pinch = null), 50); });
vp.addEventListener('dblclick', (e) => animateTo(e.clientX - (e.clientX - Pan.x) * 2, e.clientY - (e.clientY - Pan.y) * 2, Math.min(6, Pan.s * 2), 400));
document.getElementById('zin').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.4);
document.getElementById('zout').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.4);
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { closeDrawer(); toggleDir(false); }
  if (e.key === '0') fit();
  if (e.key === 't' || e.key === 'T') toggleDir(!dirOpen());
  const z = LAYOUT?.zones[+e.key - 1]; if (z) focusZone(z);
  if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.3);
  if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.3);
});
addEventListener('resize', () => LAYOUT && fit(false));
document.querySelectorAll('[data-group]').forEach((b) => b.onclick = () => {
  if (MODE === b.dataset.group) return;
  MODE = b.dataset.group;
  document.querySelectorAll('[data-group]').forEach((x) => x.classList.toggle('on', x === b));
  world.classList.add('fade');
  setTimeout(() => { LAYOUT = null; render(LIVE); fit(false); world.classList.remove('fade'); }, 250);
});

// ================= simulation (staged, clearly labelled) =================
function applyDemo(st) {
  const s = JSON.parse(JSON.stringify(st));
  const staff = s.staff.filter((e) => e.kind === 'staff' && e.tool !== 'hermes' && e.tool !== 'codex');
  const pick = (i) => staff[(DEMO.seed + i * 5) % staff.length];
  const now = Date.now();
  const work = (e, act, extra = {}) => Object.assign(e, { status: 'working', activity: act, failed: null, lastRun: now, feed: [...e.feed.slice(-4), { t: now - 4000, k: 'prompt', x: `Scheduled run: ${e.task}` }, { t: now - 1500, k: 'tool', x: act }] }, extra);
  work(pick(0), 'Briefing helpers: competitor research', { helpers: [{ id: 'd1', task: 'Pull top-10 SERP pages for the topic' }, { id: 'd2', task: 'Summarise GSC impressions by page' }] });
  work(pick(1), 'Using skill codex · second opinion', { reach: 'codex' });
  work(pick(2), 'Editing blog/ai-agents-pricing.html');
  Object.assign(pick(3), { status: 'idle', activity: 'Done - task complete', lastRun: now - 60e3 });
  Object.assign(pick(4), { status: 'waiting', activity: 'Needs approval: Running: git push origin main' });
  const h = s.staff.find((e) => e.tool === 'hermes'); if (h) work(h, 'Replying in chat', { reach: 'openclaw' });
  return s;
}
document.getElementById('demoBtn').onclick = () => {
  DEMO = DEMO ? null : { seed: Math.floor(Math.random() * 97) };
  document.getElementById('demoBtn').classList.toggle('on', !!DEMO);
  document.getElementById('demoBtn').textContent = DEMO ? '⏸' : '▶';
  render(LIVE);
};
setInterval(() => { if (DEMO) { DEMO.seed = (DEMO.seed + 3) % 97; render(LIVE); } }, 25000);

document.getElementById('tickHead').onclick = () => { const t = document.getElementById('ticker'); t.classList.toggle('open'); document.getElementById('tickArrow').textContent = t.classList.contains('open') ? '▾' : '▸'; };

// ================= view links: ?focus=2&zoom=1.1&agent=<id>&panel=company&clean=1 =================
function applyViewParams() {
  const q = new URLSearchParams(location.search);
  if (q.get('clean') === '1') document.body.classList.add('clean');
  if (q.get('panel') === 'company') openCompany();
  const agent = q.get('agent');
  if (agent) { const e = STATE.staff.find((x) => x.id === agent || x.name.toLowerCase() === agent.toLowerCase()); if (e) openDrawer(e.id); }
  const focus = q.get('focus');
  if (focus !== null && LAYOUT.zones[+focus]) focusZone(LAYOUT.zones[+focus]);
  const zoom = parseFloat(q.get('zoom'));
  if (zoom) setTimeout(() => { const cx = parseFloat(q.get('x')), cy = parseFloat(q.get('y')); if (!isNaN(cx) && !isNaN(cy)) { const [wx, wy] = P(cx, cy, 1); Pan.x = innerWidth / 2 - wx * zoom; Pan.y = innerHeight / 2 - wy * zoom; } Pan.s = zoom; apply(); }, 700);
}

// ================= live data =================
setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);
const SNAP = new URLSearchParams(location.search).get('snap') === '1';
function connect() {
  if (SNAP) { // static snapshot: load once, stop animating, so headless screenshots can finish
    fetch('/api/state').then((r) => r.json()).then((j) => { LIVE = j; render(j); setTimeout(() => { cancelAnimationFrame(raf); document.querySelectorAll('.zzz,.neon,.breathe,.hands,.wave,.stir,.steam,.caret').forEach((n) => (n.style.animation = 'none')); }, 900); });
    return;
  }
  const es = new EventSource('/api/stream');
  es.onmessage = (m) => { try { LIVE = JSON.parse(m.data); render(LIVE); } catch (err) { console.error(err); } };
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}
connect();
